name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing or new semantic version tag (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag }}
  DOTNET_NOLOGO: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate tag and remote uniqueness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Tag must match ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$" >&2; exit 1 ;;
          esac
          python3 - "$TAG" <<'PY'
          import re, sys
          tag = sys.argv[1]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?", tag):
              raise SystemExit("invalid release tag")
          PY
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Remote tag already exists: $TAG" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG" >&2
            exit 1
          fi

  build:
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Set release version (Linux)
        if: runner.os == 'Linux'
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Set release version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: "\"VERSION=$($env:TAG.Substring(1))\" >> $env:GITHUB_ENV"
      - name: Restore for runtime
        run: dotnet restore QuotaSight.slnx --runtime ${{ matrix.rid }}
      - name: Test Release
        run: dotnet test QuotaSight.slnx -c Release --no-restore
      # The Windows build is a GUI subsystem binary (WinExe), so the smoke test must be started
      # and awaited explicitly; a direct invocation would return immediately without an exit code.
      - name: Publish NativeAOT (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eu
          dotnet publish src/QuotaSight.UI/QuotaSight.UI.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -p:Version=$VERSION --no-restore -o publish
          chmod +x publish/QuotaSight.UI
          publish/QuotaSight.UI --smoke-test
          folder="QuotaSight-$VERSION-${{ matrix.rid }}"
          # Release ships no debug symbols: the project stops generating them, this removes any
          # stale copy an incremental publish could still have laid down.
          find publish -type f \( -name '*.pdb' -o -name '*.dbg' \) -delete
          rm -rf "$folder"
          mv publish "$folder"
          chmod +x "$folder/QuotaSight.UI"
          test -x "$folder/QuotaSight.UI"
          zip -r "$folder.zip" "$folder"
      - name: Publish the Collector NativeAOT (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eu
          dotnet publish src/QuotaSight.Collector/QuotaSight.Collector.csproj -c Release -r linux-x64 --self-contained true -p:PublishAot=true -p:Version=$VERSION --no-restore -o publish-collector
          chmod +x publish-collector/QuotaSight.Collector
          # Preview only: the synthetic fixture is piped in, so the binary runs end to end without a
          # socket, without a state directory and without sending anything.
          publish-collector/QuotaSight.Collector --preview --generation 1 --bucket-time-zone Asia/Tokyo \
            < tests/QuotaSight.Collector.Tests/Fixtures/graph-4.23.0-positive.json > /dev/null
          echo "collector executable: $(stat -c %s publish-collector/QuotaSight.Collector) bytes"
          collector_folder="QuotaSight-Collector-$VERSION-linux-x64"
          # Release ships no debug symbols: the project stops generating them, this removes any
          # stale copy an incremental publish could still have laid down.
          find publish-collector -type f \( -name '*.pdb' -o -name '*.dbg' \) -delete
          rm -rf "$collector_folder"
          mv publish-collector "$collector_folder"
          chmod +x "$collector_folder/QuotaSight.Collector"
          test -x "$collector_folder/QuotaSight.Collector"
          collector_zip="$collector_folder.zip"
          zip -r "$collector_zip" "$collector_folder"
      - name: Check the Collector archive (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eu
          collector_folder="QuotaSight-Collector-$VERSION-linux-x64"
          collector_zip="$collector_folder.zip"
          if unzip -Z1 "$collector_zip" | grep -Eq '\.(pdb|dbg)$'; then
            echo "debug symbols leaked into $collector_zip" >&2
            exit 1
          fi
          if unzip -Z1 "$collector_zip" | grep -Evq "^$collector_folder/"; then
            echo "every entry must live under $collector_folder/" >&2
            exit 1
          fi
          count=$(unzip -Z1 "$collector_zip" | grep -v '/$' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "the collector archive must hold exactly one file but holds $count" >&2
            exit 1
          fi
          if [ "$(unzip -Z1 "$collector_zip" | grep -v '/$')" != "${collector_folder}/QuotaSight.Collector" ]; then
            echo "the collector archive must hold exactly ${collector_folder}/QuotaSight.Collector" >&2
            exit 1
          fi
          unzip -l "$collector_zip"
      - name: Publish NativeAOT (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet publish src/QuotaSight.UI/QuotaSight.UI.csproj -c Release -r $env:RID --self-contained true -p:PublishAot=true -p:Version=$env:VERSION --no-restore -o publish
          $process = Start-Process -FilePath .\publish\QuotaSight.UI.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "smoke test failed with exit code $($process.ExitCode)" }
          $bytes = [System.IO.File]::ReadAllBytes((Get-Item '.\publish\QuotaSight.UI.exe').FullName)
          if ([System.BitConverter]::ToUInt16($bytes, 0) -ne 0x5A4D) { throw "published executable is not an MZ image" }
          $eLfanew = [System.BitConverter]::ToInt32($bytes, 0x3C)
          if ([System.BitConverter]::ToUInt32($bytes, $eLfanew) -ne 0x00004550) { throw "PE signature not found at e_lfanew=$eLfanew" }
          $subsystem = [System.BitConverter]::ToUInt16($bytes, $eLfanew + 0x5C)
          if ($subsystem -ne 2) { throw "expected subsystem 2 (WINDOWS_GUI) but found $subsystem" }
          Write-Host "PE subsystem: $subsystem (WINDOWS_GUI)"
          $folder = "QuotaSight-$env:VERSION-$env:RID"
          # Release ships no debug symbols: the project stops generating them, this removes any
          # stale copy an incremental publish could still have laid down.
          Get-ChildItem -Path publish -Recurse -File -Include '*.pdb','*.dbg' | Remove-Item -Force
          if (Test-Path $folder) { Remove-Item -Recurse -Force $folder }
          Move-Item -Path publish -Destination $folder
          Compress-Archive -Path $folder -DestinationPath "$folder.zip" -Force
        env:
          RID: ${{ matrix.rid }}
      - name: List archive contents (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eu
          folder="QuotaSight-$VERSION-${{ matrix.rid }}"
          zip_file="$folder.zip"
          if unzip -Z1 "$zip_file" | grep -Eq '\.(pdb|dbg)$'; then
            echo "debug symbols leaked into $zip_file" >&2
            exit 1
          fi
          if unzip -Z1 "$zip_file" | grep -Evq "^$folder/"; then
            echo "every entry must live under $folder/" >&2
            exit 1
          fi
          unzip -l "$zip_file"
      - name: List archive contents (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $folder = "QuotaSight-$env:VERSION-$env:RID"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Get-Item "$folder.zip").FullName)
          try {
            $entries = $archive.Entries | ForEach-Object { $_.FullName }
            $symbols = $entries | Where-Object { $_ -match '\.(pdb|dbg)$' }
            if ($symbols) { throw "debug symbols leaked into $folder.zip: $($symbols -join ', ')" }
            $outside = $entries | Where-Object { $_ -ne "$folder/" -and $_ -notlike "$folder/*" }
            if ($outside) { throw "every entry must live under $folder/: $($outside -join ', ')" }
            if (-not ($entries | Where-Object { $_ -like "$folder/*" })) { throw "archive does not contain $folder/" }
            foreach ($entry in $archive.Entries) { Write-Host ("{0,12}  {1}" -f $entry.Length, $entry.FullName) }
          } finally { $archive.Dispose() }
        env:
          RID: ${{ matrix.rid }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuotaSight-${{ env.VERSION }}-${{ matrix.rid }}
          path: QuotaSight-${{ env.VERSION }}-${{ matrix.rid }}.zip
          if-no-files-found: error
      - name: Upload the Collector artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: QuotaSight-Collector-${{ env.VERSION }}-linux-x64
          path: QuotaSight-Collector-${{ env.VERSION }}-linux-x64.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: QuotaSight-*
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -eu
          gh release create "$TAG" release-assets/QuotaSight-*.zip --title "$TAG" --target "$RELEASE_SHA" --generate-notes
