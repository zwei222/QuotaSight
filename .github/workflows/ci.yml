name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true

jobs:
  usage-api:
    name: Usage API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/QuotaSight.Usage.Api/package-lock.json
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # The wire test runs the real collector preview binary over the synthetic fixture.
      - name: Build Collector for the wire fixture
        run: dotnet build src/QuotaSight.Collector/QuotaSight.Collector.csproj --configuration Release
      - name: Install
        run: npm ci
        working-directory: src/QuotaSight.Usage.Api
      - name: Typecheck
        run: npm run typecheck
        working-directory: src/QuotaSight.Usage.Api
      - name: Test
        run: npm test
        working-directory: src/QuotaSight.Usage.Api

  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore QuotaSight.slnx
      - name: Format verification
        run: dotnet format QuotaSight.slnx --verify-no-changes --no-restore
      - name: Build Release
        run: dotnet build QuotaSight.slnx --configuration Release --no-restore
      - name: Test Release
        run: dotnet test QuotaSight.slnx --configuration Release --no-build --no-restore
      - name: Restore Native AOT
        run: dotnet restore QuotaSight.slnx --runtime ${{ runner.os == 'Windows' && 'win-x64' || 'linux-x64' }}
      - name: Publish Native AOT
        run: dotnet publish src/QuotaSight.UI/QuotaSight.UI.csproj --configuration Release --runtime ${{ runner.os == 'Windows' && 'win-x64' || 'linux-x64' }} --self-contained true -p:PublishAot=true --no-restore -o publish
      - name: Smoke Native AOT (Linux)
        if: runner.os == 'Linux'
        run: ./publish/QuotaSight.UI --smoke-test
      - name: Smoke Native AOT (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\publish\QuotaSight.UI.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "smoke test failed with exit code $($process.ExitCode)" }
          Write-Host "smoke test exit code: $($process.ExitCode)"
