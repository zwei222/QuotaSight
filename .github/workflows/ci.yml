name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore QuotaSight.slnx
      - name: Format verification
        run: dotnet format QuotaSight.slnx --verify-no-changes --no-restore
      - name: Build Release
        run: dotnet build QuotaSight.slnx --configuration Release --no-restore
      - name: Test Release
        run: dotnet test QuotaSight.slnx --configuration Release --no-build --no-restore
      - name: Restore Native AOT
        run: dotnet restore QuotaSight.slnx --runtime ${{ runner.os == 'Windows' && 'win-x64' || 'linux-x64' }}
      - name: Publish Native AOT
        run: dotnet publish src/QuotaSight.UI/QuotaSight.UI.csproj --configuration Release --runtime ${{ runner.os == 'Windows' && 'win-x64' || 'linux-x64' }} --self-contained true -p:PublishAot=true --no-restore -o publish
      - name: Smoke Native AOT (Linux)
        if: runner.os == 'Linux'
        run: ./publish/QuotaSight.UI --smoke-test
      - name: Smoke Native AOT (Windows)
        if: runner.os == 'Windows'
        run: .\publish\QuotaSight.UI.exe --smoke-test
      - name: Probe Windows notification API
        if: runner.os == 'Windows'
        run: .\publish\QuotaSight.UI.exe --notification-probe
